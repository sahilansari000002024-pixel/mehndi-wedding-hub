<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehndi Wedding Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8f0;color:#42251d}
header{background:#7b2638;color:white;text-align:center;padding:30px 10px}
header h1{font-size:32px;margin:5px}
header p{font-size:16px}
nav{background:#4c1827;padding:15px;text-align:center}
nav a{color:white;text-decoration:none;margin:10px;font-weight:bold}
.hero{text-align:center;padding:45px 15px;background:#f8dfd1}
.hero h2{font-size:30px;color:#8c2941}
button{background:#8c2941;color:white;border:0;padding:12px 22px;border-radius:25px;font-size:16px}
section{padding:25px 15px;text-align:center}
h2{color:#8c2941}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gallery img{width:100%;height:190px;object-fit:cover;border-radius:12px}
.card{background:white;padding:10px;border-radius:12px;box-shadow:0 2px 8px #ddd}
footer{background:#4c1827;color:white;text-align:center;padding:25px}
</style>
</head>
