<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehndi Wedding Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
}

body {
    background: #fff8f0;
    color: #43251f;
}

header {
    background: #7b1835;
    color: white;
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    font-size: 32px;
}

header p {
    margin-top: 8px;
}

nav {
    background: #4c1025;
    padding: 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 8px;
    font-weight: bold;
}

.hero {
    min-height: 430px;
    background: linear-gradient(#0005,#0005),
    url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1200') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 25px;
}

.hero h2 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 18px;
}

.button {
    display: inline-block;
    background: #d69b35;
    color: white;
    padding: 12px 25px;
    margin-top: 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
}

section {
    padding: 45px 18px;
    text-align: center;
}

section h2 {
    color: #8a2040;
    font-size: 28px;
    margin-bottom: 25px;
}

.cards
