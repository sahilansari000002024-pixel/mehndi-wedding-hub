<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehndi Wedding Hub</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff8f3;
 color:#44202e;
}
header{
 background:linear-gradient(135deg,#650d38,#c04470);
 color:white;
 text-align:center;
 padding:35px 12px;
}
header h1{font-size:32px}
nav{
 display:flex;
 overflow-x:auto;
 gap:8px;
 padding:12px;
 background:white;
 position:sticky;
 top:0;
 z-index:5;
}
button{
 border:0;
 padding:12px 16px;
 border-radius:25px;
 background:#f5dce6;
 color:#76133f;
 font-weight:bold;
 cursor:pointer;
 white-space:nowrap;
}
button.active,.load{
 background:#79123f;
 color:white;
}
main{padding:15px;max-width:1200px;margin:auto}
h2{text-align:center;color:#8a1949}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:12px;
}
.card{
 background:white;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 2px 8px #0002;
}
.card img{
 width:100%;
 height:180px;
 object-fit:cover;
 display:block;
 cursor:pointer;
}
.card p{
 text-align:center;
 font-size:13px;
 font-weight:bold;
 padding:5px;
}
.load{
 display:block;
 margin:25px auto;
 padding:14px 30px;
}
footer{
 background:#650d38;
 color:white;
 text-align:center;
 padding:30px 10px;
}
.whatsapp{
 display:inline-block;
 background:#159b51;
 color:white;
 padding:14px 25px;
 border-radius:25px;
 text-decoration:none;
}
#viewer{
 display:none;
 position:fixed;
 inset:0;
 background:#000e;
 z-index:20;
 align-items:center;
 justify-content:center;
}
#viewer img{
 max-width:95%;
 max-height:85%;
}
#viewer button{
 position:absolute;
 top:15px;
 right:15px;
 font-size:25px;
}
</style>
</head>

<body>

<header>
<h1>🌸 Mehndi Wedding Hub 🌸</h1>
<p>Mehndi Designs | Wedding Decoration | Wedding Gallery</p>
</header>

<nav id="nav"></nav>

<main>
<h2 id="title">Bridal Mehndi Designs</h2>
<p style="text-align:center" id="info">
अपनी पसंद के सुंदर डिजाइन देखें।
</p>

<div class="grid" id="gallery"></div>

<button class="load" id="load">और डिजाइन देखें</button>
</main>

<footer>
<h2 style="color:white">Mehndi Wedding Hub</h2>
<p>आपकी शादी को बनाएँ और भी खास ❤️</p>
<a class="whatsapp"
href="https://wa.me/?text=Hello%20Mehndi%20Wedding%20Hub">
WhatsApp Contact
</a>
</footer>

<div id="viewer" onclick="closePhoto()">
<button>✖</button>
<img id="big">
</div>

<script>

const categories=[

{
name:"Bridal Mehndi",
title:"👰 Bridal Mehndi Designs",
tag:"bridal,henna,hand"
},

{
name:"Arabic Mehndi",
title:"🌿 Arabic Mehndi Designs",
tag:"arabic,henna"
},

{
name:"Simple Mehndi",
title:"🌸 Simple Mehndi Designs",
tag:"simple,mehndi,henna"
},

{
name:"Wedding Decoration",
title:"💐 Wedding Decoration",
tag:"wedding,decoration,flowers"
},

{
name:"Wedding Gallery",
title:"📸 Wedding Photo Gallery",
tag:"indian,wedding,bride"
},

{
name:"Wedding Planning",
title:"💍 Wedding Planning Ideas",
tag:"wedding,celebration"
}

];

let current=0;
let shown=0;
const total=120;

const nav=document.getElementById("nav");
const gallery=document.getElementById("gallery");

categories.forEach((c,i)=>{
 let b=document.createElement("button");
 b.textContent=c.name;

 b.onclick=()=>{
  current=i;
  shown=0;
  gallery.innerHTML="";
  document.getElementById("title").textContent=c.title;

  document.querySelectorAll("nav button")
  .forEach(x=>x.classList.remove("active"));

  b.classList.add("active");
  loadPhotos();
 };

 nav.appendChild(b);
});

function loadPhotos(){

 let c=categories[current];

 let end=Math.min(shown+30,total);

 for(let i=shown;i<end;i++){

  let card=document.createElement("div");
  card.className="card";

  let img=document.createElement("img");

  img.loading="lazy";
  img.alt=c.name+" Design "+(i+1);

  img.src=
  "https://loremflickr.com/600/800/"
  +encodeURIComponent(c.tag)
  +"?lock="+(current*1000+i+1);

  img.onerror=function(){
   this.onerror=null;
   this.src=
   "https://placehold.co/600x800/f5e0e9/78133f?text="
   +encodeURIComponent(c.name+" "+(i+1));
  };

  img.onclick=()=>{
   document.getElementById("big").src=img.src;
   document.getElementById("viewer").style.display="flex";
  };

  let p=document.createElement("p");
  p.textContent=c.name+" Design "+(i+1);

  card.appendChild(img);
  card.appendChild(p);
  gallery.appendChild(card);
 }

 shown=end;

 document.getElementById("load").style.display=
 shown>=total?"none":"block";
}

document.getElementById("load").onclick=loadPhotos;

function closePhoto(){
 document.getElementById("viewer").style.display="none";
}

document.getElementById("nav").children[0].click();

</script>

</body>
</html>
